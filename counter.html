<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
    </head>
    <body>
        <h2>Counter:<span id="count">0</span></h2>
        <button id="sum">add</button>
        <button id="subtract">sub</button>
        <button id="multiply">multiply</button>
        <button id="divide">divide</button>

        <script>
            const btn1 = document.getElementById("sum");
            btn1.addEventListener("click", add);

            const btn2 = document.getElementById("subtract");
            btn2.addEventListener("click", subtract);

            const btn3 = document.getElementById("multiply");
            btn3.addEventListener("click", multiply);

            const btn4 = document.getElementById("divide");
            btn4.addEventListener("click", divide);

            let count = 0;

            function increase() {
                count++;
                document.getElementById("count").innerText = count;
            }

            btn1.addEventListener("click", increase);

            function decrease() {
                count--;
                document.getElementById("count").innerText = count;
            }

            function reset() {
                count = 0;
                document.getElementById("count").innerText = count;
            }

            let a = 10;
            let b = 5;

            function add() {
                let sum = a + b;
                document.getElementById("count").innerText = sum;
            }

            function subtract() {
                let difference = a - b;
                document.getElementById("count").innerText = difference;
            }

            function multiply() {
                let product = a * b;
                document.getElementById("count").innerText = product;
            }

            function divide() {
                let quotient = a / b;
                document.getElementById("count").innerText = quotient;
            }
        </script>
    </body>
</html>
